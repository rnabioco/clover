url: https://rnabioco.github.io/clover/

template:
  bootstrap: 5
  package: rbitemplate
  bslib:
    primary: "#009E73"

reference:
  - title: Read
    contents:
    - starts_with("read_")

  - title: Create
    contents:
    - starts_with("create_")

  - title: Analysis
    contents:
    - abundance_count_matrix
    - build_coldata
    - charging_count_matrix
    - compute_charging_diffs
    - compute_odds_ratios
    - compute_ror
    - run_deseq
    - tidy_deseq_results

  - title: Plot
    contents:
    - starts_with("plot_")

  - title: MODOMICS
    contents:
    - fetch_modomics_mods

  - title: Variables
    contents:
    - aa_props
    - trna_consensus_labels

  - title: Utilities
    contents:
    - clover_example
    - list_pipeline_files
    - order_sprinzl_positions
