url: https://rnabioco.github.io/clover/

template:
  bootstrap: 5
  package: rbitemplate
  bslib:
    primary: "#009E73"

navbar:
  components:
    articles:
      text: Articles
      menu:
      - text: Plotting modification heatmaps
        href: articles/heatmap.html
      - text: Modification rewiring analysis
        href: articles/rewiring.html
      - text: Plotting tRNA structures
        href: articles/structure.html

reference:
  - title: Read
    contents:
    - starts_with("read_")

  - title: Create
    contents:
    - starts_with("create_")

  - title: Analysis
    contents:
    - abundance_count_matrix
    - aggregate_or_isodecoder
    - build_coldata
    - calculate_rewiring_scores
    - charging_count_matrix
    - clean_odds_ratios
    - compute_bcerror_delta
    - compute_charging_diffs
    - filter_linkages
    - compute_odds_ratios
    - call_bcerror_sites
    - compute_charging_odds_ratios
    - charging_odds_ratios_from_counts
    - summarize_mod_calls
    - compute_ror
    - compute_ror_isodecoder
    - perform_pcoa
    - prepare_rewiring_matrix
    - run_deseq
    - tabulate_deseq
    - tidy_deseq_results

  - title: Plot
    contents:
    - prep_mod_heatmap
    - plot_abundance_charging
    - plot_bcerror_profile
    - plot_charging_diffs
    - plot_charging_ratios
    - plot_chord_or
    - plot_chord_ror
    - plot_mod_heatmap
    - plot_mod_landscape
    - plot_pcoa_rewiring
    - plot_volcano

  - title: Network
    contents:
    - build_or_network
    - plot_arc_diagram

  - title: Structure
    contents:
    - default_mod_palette
    - plot_tRNA_structure
    - structure_html
    - structure_organisms
    - structure_to_png
    - structure_trnas

  - title: MODOMICS
    contents:
    - modomics_mods
    - modomics_organisms
    - fetch_modomics_mods

  - title: Identity elements
    contents:
    - identity_elements
    - identity_organisms
    - map_identity_to_trna
    - plot_identity_panel
    - plot_identity_structure
    - tertiary_contacts

  - title: Statistics
    contents:
    - calc_fold_change
    - cohens_d
    - propagate_error_diff
    - propagate_error_ratio

  - title: Utilities
    contents:
    - aa_colors
    - charging_colors
    - clover_example
    - dna_to_rna_anticodon
    - shorten_trna_names
    - list_pipeline_files
    - order_sprinzl_positions
    - trna_regions

articles:
  - title: Articles
    contents:
    - articles/heatmap
    - articles/rewiring
    - articles/structure
