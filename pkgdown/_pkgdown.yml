url: https://rnabioco.github.io/clover/

template:
  bootstrap: 5
  package: rbitemplate
  bslib:
    primary: "#009E73"

reference:
  - title: Read
    contents:
    - starts_with("read_")

  - title: Create
    contents:
    - starts_with("create_")

  - title: Analysis
    contents:
    - abundance_count_matrix
    - aggregate_or_isodecoder
    - build_coldata
    - calculate_rewiring_scores
    - charging_count_matrix
    - clean_odds_ratios
    - compute_charging_diffs
    - filter_linkages
    - compute_odds_ratios
    - compute_ror
    - compute_ror_isodecoder
    - perform_pcoa
    - prepare_rewiring_matrix
    - run_deseq
    - tabulate_deseq
    - tidy_deseq_results

  - title: Plot
    contents:
    - starts_with("plot_")

  - title: Network
    contents:
    - build_or_network
    - plot_arc_diagram

  - title: Structure
    contents:
    - default_mod_palette
    - plot_tRNA_structure
    - structure_organisms
    - structure_to_png
    - structure_trnas

  - title: MODOMICS
    contents:
    - modomics_mods
    - modomics_organisms
    - fetch_modomics_mods

  - title: Statistics
    contents:
    - calc_fold_change
    - cohens_d
    - propagate_error_diff
    - propagate_error_ratio

  - title: Utilities
    contents:
    - aa_colors
    - charging_colors
    - clover_example
    - list_pipeline_files
    - order_sprinzl_positions
    - trna_regions
