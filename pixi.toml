[workspace]
authors = ["Jay Hesselberth <jay.hesselberth@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "clover"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
setup = "Rscript -e \"if (!requireNamespace('pak', quietly = TRUE)) install.packages('pak', repos = 'https://r-lib.github.io/p/pak/stable/'); pak::local_install_dev_deps(upgrade = FALSE); pak::pak(c('devtools', 'roxygen2', 'usethis', 'pkgdown', 'rnabioco/rbitemplate'))\""
document = "Rscript -e \"devtools::document()\""
test = "Rscript -e \"devtools::test()\""
check = "Rscript -e \"devtools::check()\""
install-air = "curl -LsSf https://github.com/posit-dev/air/releases/latest/download/air-installer.sh | sh"

[dependencies]
r-base = ">=4.5.2,<4.6"
zlib = ">=1.3.1,<2"
r-xml2 = ">=1.3"
r-curl = ">=6.0"
r-openssl = ">=2.0"
r-httr2 = ">=1.0"
r-gitcreds = ">=0.1"
r-gh = ">=1.4"
nlopt = ">=2.10.0,<3"
# Under `pixi run setup` pak compiles R packages from source: fs builds its
# bundled libuv with cmake, and rsvg links librsvg, found through pkg-config
cmake = "*"
pkg-config = "*"
librsvg = "*"
glib = "*"
# R packages with system libraries come from conda-forge as binaries, which
# `pixi run setup` then keeps (igraph links libxml2 and lzma, V8 needs libv8)
r-igraph = "*"
r-v8 = "*"
r-systemfonts = "*"
r-vroom = "*"
r-isoband = "*"
r-stringi = "*"
r-sass = "*"
r-rcpparmadillo = "*"

[activation.env]
PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/pkgconfig:$CONDA_PREFIX/share/pkgconfig"

[feature.struct]
dependencies = { python = ">=3.11", lxml = "*", r2r = ">=1.0.6,<2", infernal = ">=1.1.5,<2" }

[environments]
struct = ["struct"]
